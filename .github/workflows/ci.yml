name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run package
      # Phase 2 distribution: the VSIX as a CI artifact only, no GitHub release (SPEC §14).
      - if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v5
        with:
          name: searchie-vsix
          path: dist-vsix/*.vsix
          if-no-files-found: error
          retention-days: 30

  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        vscode: ['1.106.0', stable]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - run: xvfb-run -a npm run test:smoke
        env:
          SEARCHIE_VSCODE: ${{ matrix.vscode }}
